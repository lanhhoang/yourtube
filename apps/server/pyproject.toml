[project]
name = "yourtube"
version = "0.1.0"
description = "Self-hosted YouTube video downloader"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "alembic>=1.20.1",
    "anyascii>=0.3.3",
    "curl-cffi>=0.17.0",
    "fastapi[standard]>=0.163.1",
    "httpx2>=2.16.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
# Ruff formats Python code blocks inside Markdown by default. The plan docs under
# docs/superpowers/ hold sketches, not runnable code, so don't format Markdown.
exclude = ["*.md"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
invalid-assignment = "ignore"
deprecated = "ignore"
missing-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
